[project]
name = "metaspread"
version = "2024.0.5"
authors = [
  { name="Alfredo Hernández-Inostroza", email="alfredo.hernandez@ug.uchile.cl" },
]
description = "A cancer and metastasis simulation package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "matplotlib==3.8.0",
  "Mesa==2.1.2",
  "numpy==1.26.0",
  "pandas==2.1.1",
  "pynput==1.7.6",
  "opencv_python==4.8.1.78"
]
[project.optional-dependencies]
# Interactive 3D viewer (metaspread/viewer3d_app.py). Kept optional so the core
# install and the byte-identity gate are unaffected.
viz = ["marimo", "plotly"]

[project.urls]
Homepage = "https://github.com/alfredohernandezinostroza/MetaSpread"
Issues = "https://github.com/alfredohernandezinostroza/MetaSpread/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "metaspread/*.py",
  "LICENSE.txt",
  "README.md",
  "requirements.txt",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Interpreter + dev tooling come from conda-forge. Python is pinned to 3.10 to
# match the interpreter the byte-identical reproducibility baseline was built on
# (3.10.12). The scientific stack (numpy/pandas/mesa/matplotlib/...) is pulled
# from PyPI via the editable metaspread install below, so [project.dependencies]
# stays the single source of truth for those exact version pins — which is what
# preserves the golden CellsData.csv checksum.
[tool.pixi.dependencies]
python = "3.10.*"
pytest = ">=7,<9"

[tool.pixi.pypi-dependencies]
metaspread = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest -q"

# Optional interactive-viewer environment: `pixi run -e viz viewer -- --sim <path>`.
# Kept in its own feature/environment so the default env (and the byte-identity
# baseline) stays minimal.
[tool.pixi.feature.viz.pypi-dependencies]
marimo = "*"
plotly = "*"

[tool.pixi.feature.viz.tasks]
viewer = "marimo run metaspread/viewer3d_app.py"

[tool.pixi.environments]
viz = ["viz"]
